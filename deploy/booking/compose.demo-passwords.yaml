# One-off maintenance only. Build first; running this service changes the six
# provenance-verified fictional accounts in the isolated preview database.
services:
  migrate:
    image: andrew-demo-password-maintenance:20261105
    environment:
      NODE_ENV: development
      ANDREW_DEMO_PASSWORDS: "1"
    volumes:
      - ./scripts/set-demo-passwords.mjs:/app/set-demo-passwords.mjs:ro
    command: [node, /app/set-demo-passwords.mjs]

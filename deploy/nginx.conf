# Replace dental.example.com and certificate paths for the deployment host.
server {
    listen 80;
    server_name dental.example.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name dental.example.com;
    ssl_certificate /etc/letsencrypt/live/dental.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dental.example.com/privkey.pem;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}

name: postgres-booking
on: [push, pull_request]
permissions:
  contents: read
jobs:
  booking:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-ephemeral-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:booking
      - run: npm run build:booking
      - run: npm run test:booking
      - run: npm run test -w @andrew/admin-web
      - run: npm run test -w @andrew/miniprogram
      - run: node scripts/validate-compose.mjs
